name: 06 - Contexts

run-name : O6 - Contexts | DEBUG - ${{ inputs.debug }}

on:
  workflow_dispatch:
    inputs:
        debug:
            type: boolean
            default: false

env : 
    MY_WORKFLOW_VAR: 'workflow'
    MY_OVERRIDE_VAR: 'workflow'

jobs:
  echo-data:
    runs-on: ubuntu-latest

    env:
      MY_OVERRIDE_VAR: 'job'
      CHANGE_SECRET_NAME: ${{ vars.OVERRIDDEN_SECRET_NAME || 'Not Available' }}
    
    environment: prod

    steps:
      - name: Display Information
        run: |
            echo "Event name: ${{ github.event_name }}"
            echo "Ref: ${{ github.ref }}"
            echo "SHA: ${{ github.sha }}"
            echo "Actor: ${{ github.actor }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Run ID: ${{ github.run_id }}"
            echo "Run number: ${{ github.run_number }}"
            echo "********** Job overridden *************"
            echo "Variable from workflow env: $MY_WORKFLOW_VAR"
            echo "Variable from job env: $MY_OVERRIDE_VAR"
            echo "Variable from step env: ${{ env.MY_OVERRIDE_VAR }}"

      - name: Retrieve Variable
        env:
          MY_OVERRIDE_VAR: 'step'
        run: |
            echo "Variable from GitHub settings: ${{ vars.MY_VAR }}"
            echo "********** Step overridden *************"
            echo "Variable from workflow env: $MY_WORKFLOW_VAR"
            echo "Variable from job env: $MY_OVERRIDE_VAR"
            echo "Variable from step env: ${{ env.MY_OVERRIDE_VAR }}"

      - name: Repository env variable from prod
        run: |
          echo "ENV Variable from GitHub settings: ${{ vars.SECRET_NAME }}"
          echo "ENV Variable overriden from step env: ${{ vars.OVERRIDDEN_SECRET_NAME }}"

      - name: Overrideen repository env variable prod
        env:
            CHANGE_SECRET_NAME: 'Sita Rama'
        run: |
          echo "ENV Variable from GitHub settings: ${{ vars.SECRET_NAME }}"
          echo "ENV Variable overriden from step env: ${{ env.CHANGE_SECRET_NAME }}"

    
